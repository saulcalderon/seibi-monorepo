# Feature: features/service.md. Withdraws, through the app, every Service a
# failed `service` run left on the test account's first Vehicle (the ones
# with a «Bombillo de freno» line), so the next run starts from no Service.
# Run through scripts/verify.sh drive <ios|android> service-cleanup.
appId: ${APP_ID}
name: Withdraw the Services a failed service run left behind
---
- stopApp
- openLink: ${DEV_URL}
- runFlow: sign-in.yaml
- runScript:
    file: scripts/first-vehicle.js
    env:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      TEST_EMAIL: ${TEST_EMAIL}
      TEST_PASSWORD: ${TEST_PASSWORD}
- startRecording: service-cleanup
- openLink: ${APP_URL}vehicle/${output.vehicleId}?tab=historial
- runFlow:
    when:
      platform: iOS
      visible: 'Open|Abrir'
    commands:
      - tapOn: 'Open|Abrir'
- extendedWaitUntil:
    visible:
      id: detail-tabs
    timeout: 20000
- repeat:
    while:
      visible:
        text: '.*Bombillo de freno.*'
    commands:
      # Other Services (a newer one from another flow) can sit above it, so the
      # expanded card's index is unknown: its withdraw button is the only one shown.
      # Centre it first: near the bottom edge the tap lands on the tab bar.
      - scrollUntilVisible:
          element:
            text: '.*Bombillo de freno.*'
          centerElement: true
      - tapOn:
          text: '.*Bombillo de freno.*'
      - extendedWaitUntil:
          visible:
            id: 'service-card-withdraw-[0-9]+'
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: 'service-card-withdraw-[0-9]+'
          centerElement: true
      - tapOn:
          id: 'service-card-withdraw-[0-9]+'
      # iOS lists the card's «Quitar» behind the alert too: the alert's is the
      # second match. Android's alert is its own window (button1 confirms).
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: 'Quitar'
                index: 1
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                id: 'android:id/button1'
      - extendedWaitUntil:
          notVisible:
            id: 'service-card-withdraw-[0-9]+'
          timeout: 15000
- takeScreenshot: service-cleanup-done
- stopRecording
