# Detalle del Vehículo (S6, SEI-61): hero, tiles and the four tabs on the
# test Yaris — record+expand+Quitar a Service, correct a reading with the
# same number, add/edit/delete a Routine, Datos, and the missing state.
appId: ${APP_ID}
name: Detalle del Vehículo shows its four tabs and edits them
---
# A failed run leaves its Service and Routines behind, and they change the
# totals this flow asserts: clear them first.
- runScript:
    file: scripts/cleanup-sei61.js
    env:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      TEST_EMAIL: ${TEST_EMAIL}
      TEST_PASSWORD: ${TEST_PASSWORD}
- runScript:
    file: scripts/first-vehicle.js
    env:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      TEST_EMAIL: ${TEST_EMAIL}
      TEST_PASSWORD: ${TEST_PASSWORD}
- stopApp
- openLink: ${DEV_URL}
- runFlow: sign-in.yaml
- startRecording: vehicle-detail

# --- From Mi flota to the detail: header, subtitle and the three tiles.
- tapOn:
    id: tab-fleet
- extendedWaitUntil:
    visible:
      id: fleet-vehicle-0
    timeout: 30000
- tapOn:
    id: fleet-vehicle-0
- extendedWaitUntil:
    visible:
      id: vehicle-hero
    timeout: 20000
- assertVisible:
    id: vehicle-subtitle
    text: '2015'
- assertVisible:
    id: tile-odometer
- assertVisible:
    id: tile-health
- assertVisible:
    id: tile-usage
- copyTextFrom:
    id: tile-odometer
- evalScript: ${output.odometer = maestro.copiedText.replace(/[^0-9]/g, '')}
- evalScript: ${output.odometerText = output.odometer.replace(/\B(?=(\d{3})+(?!\d))/g, ',')}
- waitForAnimationToEnd
- takeScreenshot: detail-01-hero-tiles

# --- Mantenimiento: the schedule banner and the Reminder groups.
- assertVisible:
    id: detail-tabs
- extendedWaitUntil:
    visible:
      id: 'schedule-banner-(pending|model|general)'
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: detail-02-mantenimiento

# --- Historial: record a Service here (notes «verify SEI-61»), expand it.
- tapOn:
    id: detail-tabs-historial
- extendedWaitUntil:
    visible:
      id: stat-services
    timeout: 15000
- assertVisible:
    id: stat-spent
- scrollUntilVisible:
    element:
      id: record-service
    direction: DOWN
- tapOn:
    id: record-service
- extendedWaitUntil:
    visible:
      id: service-form-title
      text: Registrar Servicio
    timeout: 20000
# One task, a $45.50 total, Mileage = the odometer read from the tile,
# Taller Norte, notes «verify SEI-61».
- tapOn:
    id: service-task-engine_oil
# Below the fold on a shorter screen (Android): scroll to it, don't expect it.
- scrollUntilVisible:
    element:
      id: service-add-item
    timeout: 15000
- scrollUntilVisible:
    element:
      id: service-total-cost
    centerElement: true
- tapOn:
    id: service-total-cost
- inputText: '45.50'
- assertVisible:
    id: service-total-cost
    text: '45.50'
- runFlow: service-hide-keyboard.yaml
# The form already offers today's odometer as the reading: typing would
# append. Assert it shows what the tile said.
- scrollUntilVisible:
    element:
      id: service-mileage
    centerElement: true
- assertVisible:
    id: service-mileage
    text: '${output.odometerText}'
- scrollUntilVisible:
    element:
      id: service-shop
    centerElement: true
- tapOn:
    id: service-shop
- inputText: Taller Norte
- runFlow: service-hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: service-notes
    centerElement: true
- tapOn:
    id: service-notes
- inputText: verify SEI-61
- tapOn:
    id: service-save
    waitToSettleTimeoutMs: 500
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Servicio registrado'
          timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: service-form
    timeout: 20000
# It sits under its month; a tap expands the PWA's card. Scroll it to the
# screen's centre first: near the bottom edge its tap point lands on the
# «Mi flota» tab, which pops the detail to the tab's root.
- scrollUntilVisible:
    element:
      id: stat-services
    direction: UP
- scrollUntilVisible:
    element:
      id: service-card-0
    direction: DOWN
    centerElement: true
- tapOn:
    id: service-card-0
- extendedWaitUntil:
    visible:
      id: service-card-body-0
    timeout: 15000
- assertVisible: 'Cambio de aceite'
- assertVisible: '\$46'
- assertVisible: 'Taller: Taller Norte'
- assertVisible: 'verify SEI-61'
- waitForAnimationToEnd
- takeScreenshot: detail-03-service-expanded
# «Quitar» asks first, then the card leaves the history.
- tapOn:
    id: service-card-withdraw-0
- extendedWaitUntil:
    visible: '¿Quitar este Servicio del historial\?'
    timeout: 5000
# «Quitar» also names the card's button behind the alert; the alert's is the
# second match.
- takeScreenshot: detail-04-withdraw-confirm
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Quitar'
          index: 1
# Android's alert is its own window; its confirm button is button1.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'android:id/button1'
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Servicio quitado del historial'
          timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: service-card-0
    timeout: 20000

# --- The latest reading opens «Corregir lectura»; the same number corrects
# nothing (the odometer does not move).
- scrollUntilVisible:
    element:
      id: reading-0
    direction: DOWN
    centerElement: true
- assertVisible:
    id: history-readings
- tapOn:
    id: reading-0
- extendedWaitUntil:
    visible:
      id: correct-sheet
    timeout: 20000
# The field's delayed focus moves the sheet as the number pad opens:
# tapping a remembered position can land on the backdrop and dismiss it.
# The field is already focused, so type first, then tap the save (the tree
# has settled by the assertion).
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: correct-reading
          timeout: 10000
- inputText: '${output.odometer}'
# On Android the open number pad pushes the sheet's content out of view (as
# in the mileage flow): Back drops the pad, never the sheet, and brings the
# field and its save back.
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - waitForAnimationToEnd
      - assertVisible:
          id: correct-reading
- extendedWaitUntil:
    visible:
      id: correct-save
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: correct-save
    waitToSettleTimeoutMs: 500
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Lectura corregida'
          timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: correct-sheet
    timeout: 20000
- takeScreenshot: detail-05-corrected

# --- Uso: the estimate card, then a Routine added, edited and deleted.
# The tabs scroll with the content: bring them back before switching.
- scrollUntilVisible:
    element:
      id: detail-tabs-uso
    direction: UP
- tapOn:
    id: detail-tabs-uso
- extendedWaitUntil:
    visible:
      id: usage-estimate
    timeout: 15000
- assertVisible:
    id: usage-update-mileage
- tapOn:
    id: routine-add
- extendedWaitUntil:
    visible:
      id: routine-sheet
    timeout: 15000
- assertVisible:
    id: routine-title
    text: Agregar Rutina
- tapOn:
    id: routine-name
- inputText: verify SEI-61 trabajo
- runFlow:
    when:
      platform: Android
    commands:
      - back
- tapOn:
    id: routine-distance
- inputText: '20'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- tapOn:
    id: routine-day-5
- tapOn:
    id: routine-save
    waitToSettleTimeoutMs: 500
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Rutina guardada'
          timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: routine-sheet
    timeout: 20000
- scrollUntilVisible:
    element:
      id: routine-0
    direction: DOWN
    centerElement: true
- assertVisible:
    id: routine-0
- assertVisible: '.*verify SEI-61 trabajo.*20 km ida y vuelta.*5 días por semana.*'
# 20 km round trip × 5 days.
- assertVisible: '.*Total de rutinas:.*100 km.*por semana.*'
- takeScreenshot: detail-06-routine
# Editing keeps the fields and changes to 3 días.
- tapOn:
    id: routine-0
- extendedWaitUntil:
    visible:
      id: routine-sheet
    timeout: 15000
- assertVisible:
    id: routine-title
    text: Editar Rutina
- tapOn:
    id: routine-day-3
- tapOn:
    id: routine-save
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: routine-sheet
    timeout: 20000
- assertVisible: '.*3 días por semana.*'
- assertVisible: '.*Total de rutinas:.*60 km.*por semana.*'
- takeScreenshot: detail-07-routine-edited
# Deleting asks first.
- tapOn:
    id: routine-0
- extendedWaitUntil:
    visible:
      id: routine-delete
    timeout: 15000
- tapOn:
    id: routine-delete
- extendedWaitUntil:
    visible: '.*Deja de contar para el cálculo de uso.*'
    timeout: 5000
- takeScreenshot: detail-08-routine-delete-confirm
# «Eliminar Rutina» also names the alert's title and the sheet's button: the
# alert's button is the one between its message and «Cancelar».
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Eliminar Rutina'
          below: '.*Deja de contar para el cálculo de uso.*'
          above: 'Cancelar'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'android:id/button1'
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Rutina eliminada'
          timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: routine-sheet
    timeout: 20000
- extendedWaitUntil:
    notVisible: '.*verify SEI-61 trabajo.*'
    timeout: 15000

# --- Datos: the rows, «Editar datos» opens and closes unchanged.
# The tabs scroll with the content: bring them back before switching.
- scrollUntilVisible:
    element:
      id: detail-tabs-datos
    direction: UP
- tapOn:
    id: detail-tabs-datos
- extendedWaitUntil:
    visible:
      id: data-rows
    timeout: 15000
- assertVisible: 'Toyota'
- assertVisible: 'Yaris'
- scrollUntilVisible:
    element: 'Kilómetros'
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: detail-09-datos
- scrollUntilVisible:
    element:
      id: data-edit
    direction: DOWN
    centerElement: true
- tapOn:
    id: data-edit
- extendedWaitUntil:
    visible:
      id: vehicle-form-brand
    timeout: 20000
- tapOn:
    id: vehicle-form-close
- extendedWaitUntil:
    notVisible:
      id: vehicle-form-brand
    timeout: 20000
# The danger action is visible; the flow never taps it.
- scrollUntilVisible:
    element:
      id: data-withdraw
    direction: DOWN
    centerElement: true
- assertVisible:
    id: data-withdraw
- takeScreenshot: detail-10-withdraw-visible

# --- A missing Vehicle explains itself (the deep link lands in Mi flota).
- openLink: ${APP_URL}vehicle/00000000-0000-0000-0000-000000000000
- runFlow:
    when:
      platform: iOS
      visible: 'Open|Abrir'
    commands:
      - tapOn: 'Open|Abrir'
- extendedWaitUntil:
    visible:
      id: vehicle-missing
    timeout: 20000
- assertVisible: 'No encontramos este Vehículo'
- takeScreenshot: detail-11-missing
- tapOn: 'Ir a Mi flota'
- extendedWaitUntil:
    visible:
      id: fleet-screen
    timeout: 15000
- stopRecording
