# Subflow, not driven alone: from the root of any tab, the header avatar
# opens Perfil inside that tab (features/profile.md). Perfil is taller than
# the screen: scroll to «Tema», sign-out or delete before tapping them.
# Feature: features/app-shell.md.
appId: ${APP_ID}
name: Open Perfil from the header avatar
---
- tapOn:
    id: open-profile
- extendedWaitUntil:
    visible:
      id: profile-screen
    timeout: 15000
- assertVisible:
    id: signed-in-as
    text: '.*${TEST_EMAIL}.*'
