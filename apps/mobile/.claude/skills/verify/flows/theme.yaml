# Feature: the theme follows the phone and the saved preference
# (features/theme.md). Run through scripts/verify.sh drive <ios|android> theme,
# which passes APP_ID and DEV_URL and sends recordings and screenshots to the
# run's evidence folder. The flow switches the device's dark mode itself and
# leaves it in light, with the preference back on Auto. The «Tema» control
# lives in Perfil, which the header avatar opens.
appId: ${APP_ID}
name: The theme follows the phone and the saved preference
---
- startRecording: theme
# The phone starts in light mode.
- setDarkMode: disabled
- stopApp
- openLink: ${DEV_URL}
# Inicio is the signed-in home (SEI-44): sign in first when signed out.
- runFlow: sign-in.yaml
- runFlow: open-profile.yaml
# Start from Auto, in case an earlier run stopped with a saved preference.
- tapOn:
    id: theme-system
- extendedWaitUntil:
    visible:
      id: theme-check
      text: 'theme: light \(system\)'
    timeout: 10000
# Let the system's crossfade (or the splash fade) finish before the picture.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: system-light
# The phone switches to dark mode while Seibi is open: the screen turns night
# in place. Perfil never leaves the screen, so nothing reloads.
- setDarkMode: enabled
- extendedWaitUntil:
    visible:
      id: theme-check
      text: 'theme: night \(system\)'
    timeout: 10000
- assertVisible:
    id: profile-screen
- assertVisible:
    id: tab-home
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: system-night
# And back to light.
- setDarkMode: disabled
- extendedWaitUntil:
    visible:
      id: theme-check
      text: 'theme: light \(system\)'
    timeout: 10000
# The person picks Oscuro: night while the phone stays light.
- tapOn:
    id: theme-night
- extendedWaitUntil:
    visible:
      id: theme-check
      text: 'theme: night \(preference\)'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: preference-night
# A cold start: the saved preference applies before the first render.
- stopApp
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: preference-night-cold-start-home
- runFlow: open-profile.yaml
- assertVisible:
    id: theme-check
    text: 'theme: night \(preference\)'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: preference-night-cold-start
# Back to Auto: the app follows the phone (light) again.
- tapOn:
    id: theme-system
- extendedWaitUntil:
    visible:
      id: theme-check
      text: 'theme: light \(system\)'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: system-light-restored
- stopRecording
