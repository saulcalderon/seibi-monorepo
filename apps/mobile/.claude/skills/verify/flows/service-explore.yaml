appId: ${APP_ID}
name: explore
---
- stopApp
- openLink: ${DEV_URL}
- runFlow: sign-in.yaml
- tapOn:
    id: open-actions
- tapOn:
    id: action-record-service
- extendedWaitUntil:
    visible:
      id: service-form
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: explore-01
- tapOn:
    id: service-task-engine_oil
- tapOn:
    id: service-add-item
- waitForAnimationToEnd
- takeScreenshot: explore-02
