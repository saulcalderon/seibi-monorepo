# Feature: the start screen speaks Spanish from es.json (features/i18n.md).
# Run through scripts/verify.sh drive <ios|android> i18n-start-screen, which
# passes APP_ID and DEV_URL and sends recordings and screenshots to the
# run's evidence folder. The expected text is copied from
# src/i18n/es.json; change both together.
appId: ${APP_ID}
name: The start screen shows its copy from es.json
---
- startRecording: i18n-start-screen
# Cold start: i18next initialises before the first render.
- stopApp
- openLink: ${DEV_URL}
# The start screen is the signed-in home (SEI-44): sign in first when signed out.
- runFlow: sign-in.yaml
# start.title
- assertVisible:
    id: start-title
    text: Seibi
# start.tagline
- assertVisible:
    id: start-tagline
    text: Mantenimiento con total claridad
# start.engineCheck, with {{reading}} filled in
- assertVisible:
    id: engine-check
    text: 'maintenance-engine: 12500 km'
# No raw key reaches the screen (Maestro matches text as a regular expression).
- assertNotVisible:
    text: '(start|update)\..*'
- takeScreenshot: start-screen-es
- stopRecording
