# After a PR lands on main: test migrations locally, then apply pending ones to production.
# The app image stays with Dokploy and the Dockerfile — this workflow does not deploy the app.
name: Migrate production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.116.0

jobs:
  guard:
    name: Require main
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main refs
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production migrations must run from main (got ${GITHUB_REF})."
            exit 1
          fi

  verify-migrations:
    name: Verify migrations on an isolated database
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Apply migrations and run database tests locally
        run: |
          supabase db start
          supabase test db

  migrate:
    name: Apply pending production migrations
    needs: verify-migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_ID }}
    steps:
      - name: Require production database secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Set repository secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PRODUCTION_PROJECT_ID, and SUPABASE_PRODUCTION_DB_PASSWORD."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: List local vs remote migrations
        run: supabase migration list

      - name: Apply pending migrations
        run: supabase db push --yes

      - name: Confirm remote is current
        run: supabase migration list
