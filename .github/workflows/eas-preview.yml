# Starts an EAS `preview` build of the native app (apps/mobile/eas.json:
# internal distribution, the Seibi variant) by hand: Actions → "EAS preview
# build" → Run workflow. EAS builds are paid, so nothing starts one
# automatically. The job queues the build and exits (--no-wait); the build's
# page on expo.dev has its progress and the install link.
#
# It needs the EXPO_TOKEN repository secret (an Expo access token) and the EAS
# project id in apps/mobile/app.config.ts (EAS_PROJECT_ID, SEI-72). While
# either is missing, the build job is skipped and the run says which one.
name: EAS preview build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

concurrency:
  group: eas-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Check EAS setup
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          ready=true
          if [ -z "$EXPO_TOKEN" ]; then
            ready=false
            echo "::notice title=EAS preview build skipped::The EXPO_TOKEN repository secret is not set. Create an Expo access token and add it under Settings → Secrets and variables → Actions."
          fi
          if ! grep -qE "^const EAS_PROJECT_ID = '[^']+';" apps/mobile/app.config.ts; then
            ready=false
            echo "::notice title=EAS preview build skipped::EAS_PROJECT_ID in apps/mobile/app.config.ts is empty. Run eas init and paste the project id (SEI-72)."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  build:
    name: Start EAS preview build
    needs: setup
    if: needs.setup.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11.3.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # EAS CLI reads app.config.ts, which needs the app's dependencies.
      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start the build
        working-directory: apps/mobile
        env:
          PLATFORM: ${{ inputs.platform }}
        run: eas build --profile preview --platform "$PLATFORM" --non-interactive --no-wait
