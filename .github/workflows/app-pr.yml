# App checks on every pull request. Dokploy builds the Dockerfile after merge.
# The pnpm scripts below run through Turborepo (turbo.json), the same commands
# developers run locally. Turbo's strict env mode only passes the variables
# declared in turbo.json (VITE_*, EXPO_PUBLIC_*) to the build.
#
# It also runs on pushes to main, so main always has a fresh Turbo cache: a
# PR's runs can restore caches saved on main or on that PR, never another PR's.
name: App PR

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    env:
      # Turbo's local cache, carried between runs by the "Turbo cache" step.
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11.3.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One cache per commit; a new commit starts from the newest one. Turbo
      # replays every task whose inputs haven't changed ("cache hit, replaying
      # logs"; "FULL TURBO" when all of them hit), so a re-run costs seconds.
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The native app's gate (apps/mobile/turbo.json): its typecheck and lint,
      # replayed from the steps above, then the check scripts in
      # apps/mobile/scripts/ (check-tokens, check-contrast, check-strings).
      - name: Native app checks
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Functions
        working-directory: supabase/functions
        run: for f in */index.ts; do deno check "$f"; done

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-key-for-ci-build
