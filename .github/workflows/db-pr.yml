# Database checks on pull requests that touch schema or pgTAP tests.
# Production migrate only applies pending migrations — it does not start a local database.
name: Database PR

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/db-pr.yml'

permissions:
  contents: read

concurrency:
  group: db-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.116.0

jobs:
  test:
    name: Apply migrations and run database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Apply migrations and run database tests locally
        run: |
          supabase db start
          supabase test db
